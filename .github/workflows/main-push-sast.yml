name: Main push SAST

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "**/*.cjs"
      - "**/*.cts"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.mts"
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Plan SAST requirement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sast: ${{ steps.plan.outputs.sast }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Classify changed paths
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail

          case "${EVENT_NAME}" in
            pull_request) base_sha="${PULL_REQUEST_BASE}" ;;
            push) base_sha="${PUSH_BASE}" ;;
            merge_group) base_sha="${MERGE_GROUP_BASE}" ;;
            *) base_sha="" ;;
          esac

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]] ||
             ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "A reliable base commit is unavailable; requiring SAST."
            node scripts/plan-security-ci.mjs --full >> "${GITHUB_OUTPUT}"
          else
            git diff --name-only -z "${base_sha}" "${GITHUB_SHA}" |
              node scripts/plan-security-ci.mjs >> "${GITHUB_OUTPUT}"
          fi

  sast:
    name: SAST
    needs: scope
    if: needs.scope.outputs.sast == 'true'
    uses: ./.github/workflows/security-sast.yml
    permissions:
      contents: read
      security-events: write

  required:
    name: SAST required gate
    needs:
      - scope
      - sast
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce planned SAST result
        env:
          SAST_PLANNED: ${{ needs.scope.outputs.sast }}
          SAST_RESULT: ${{ needs.sast.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: |
          set -Eeuo pipefail

          [[ "${SCOPE_RESULT}" == "success" ]] || {
            echo "SAST scope planning did not succeed." >&2
            exit 1
          }

          if [[ "${SAST_PLANNED}" == "true" ]]; then
            [[ "${SAST_RESULT}" == "success" ]] || {
              echo "SAST was required but finished with ${SAST_RESULT}." >&2
              exit 1
            }
          else
            [[ "${SAST_RESULT}" == "skipped" ]] || {
              echo "SAST was not required but finished with ${SAST_RESULT}." >&2
              exit 1
            }
          fi

          echo "The planned SAST policy passed."
