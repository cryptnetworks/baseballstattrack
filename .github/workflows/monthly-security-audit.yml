name: Monthly security audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "package-lock.json"
      - "package.json"
      - "services/discord-bot/Dockerfile"
      - "services/discord-bot/requirements.lock"
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Plan security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      containers: ${{ steps.plan.outputs.containers }}
      node_dependencies: ${{ steps.plan.outputs['node-dependencies'] }}
      python_dependencies: ${{ steps.plan.outputs['python-dependencies'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Classify changed paths
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            node scripts/plan-security-ci.mjs --full >> "${GITHUB_OUTPUT}"
          elif ! git cat-file -e "${PULL_REQUEST_BASE}^{commit}" 2>/dev/null; then
            node scripts/plan-security-ci.mjs --full >> "${GITHUB_OUTPUT}"
          else
            git diff --name-only -z "${PULL_REQUEST_BASE}" "${GITHUB_SHA}" |
              node scripts/plan-security-ci.mjs >> "${GITHUB_OUTPUT}"
          fi

  sast:
    name: SAST
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/security-sast.yml
    permissions:
      contents: read
      security-events: write

  node-dependencies:
    name: Node dependency audit
    needs: scope
    if: needs.scope.outputs.node_dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  python-dependencies:
    name: Python dependency audit
    needs: scope
    if: needs.scope.outputs.python_dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/discord-bot/requirements.lock

      - name: Audit Python dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --strict --require-hashes --requirement services/discord-bot/requirements.lock

  repository-scan:
    name: Repository and secret scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Trivy 0.73.0
        run: |
          set -Eeuo pipefail
          archive=trivy_0.73.0_Linux-64bit.tar.gz
          root=https://github.com/aquasecurity/trivy/releases/download/v0.73.0
          curl --fail --location --proto '=https' --tlsv1.2 --output "${RUNNER_TEMP}/${archive}" "${root}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --output "${RUNNER_TEMP}/trivy-checksums.txt" "${root}/trivy_0.73.0_checksums.txt"
          grep " ${archive}$" "${RUNNER_TEMP}/trivy-checksums.txt" | (cd "${RUNNER_TEMP}" && sha256sum --check)
          mkdir "${RUNNER_TEMP}/trivy"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/trivy" trivy
          echo "${RUNNER_TEMP}/trivy" >> "${GITHUB_PATH}"

      - name: Scan repository dependencies, configuration, and current-tree secrets
        run: trivy filesystem --scanners vuln,misconfig,secret --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules --skip-dirs .next .

      - name: Install TruffleHog 3.96.0
        run: |
          set -Eeuo pipefail
          archive=trufflehog_3.96.0_linux_amd64.tar.gz
          root=https://github.com/trufflesecurity/trufflehog/releases/download/v3.96.0
          curl --fail --location --proto '=https' --tlsv1.2 --output "${RUNNER_TEMP}/${archive}" "${root}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --output "${RUNNER_TEMP}/trufflehog-checksums.txt" "${root}/trufflehog_3.96.0_checksums.txt"
          grep " ${archive}$" "${RUNNER_TEMP}/trufflehog-checksums.txt" | (cd "${RUNNER_TEMP}" && sha256sum --check)
          mkdir "${RUNNER_TEMP}/trufflehog"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/trufflehog" trufflehog
          echo "${RUNNER_TEMP}/trufflehog" >> "${GITHUB_PATH}"

      - name: Scan complete Git history for verified secrets
        run: trufflehog git file://. --only-verified --fail --no-update

  containers:
    name: Container audit
    needs: scope
    if: needs.scope.outputs.containers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy 0.73.0
        run: |
          set -Eeuo pipefail
          archive=trivy_0.73.0_Linux-64bit.tar.gz
          root=https://github.com/aquasecurity/trivy/releases/download/v0.73.0
          curl --fail --location --proto '=https' --tlsv1.2 --output "${RUNNER_TEMP}/${archive}" "${root}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --output "${RUNNER_TEMP}/trivy-checksums.txt" "${root}/trivy_0.73.0_checksums.txt"
          grep " ${archive}$" "${RUNNER_TEMP}/trivy-checksums.txt" | (cd "${RUNNER_TEMP}" && sha256sum --check)
          mkdir "${RUNNER_TEMP}/trivy"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/trivy" trivy
          echo "${RUNNER_TEMP}/trivy" >> "${GITHUB_PATH}"

      - name: Build production images
        run: |
          set -Eeuo pipefail
          docker build --target runtime --tag baseballstattrack:security .
          docker build --target migration --tag baseballstattrack-migration:security .
          docker build --tag baseballstattrack-discord:security services/discord-bot

      - name: Block fixable high and critical container findings
        run: |
          set -Eeuo pipefail
          for image in baseballstattrack:security baseballstattrack-migration:security baseballstattrack-discord:security; do
            trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "${image}"
          done

      - name: Report pinned infrastructure-image findings
        run: |
          set -Eeuo pipefail
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 postgres:17-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
