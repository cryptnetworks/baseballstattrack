name: Publish documentation wiki

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Validate and show the wiki diff, or publish it
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - publish
      source_sha:
        description: Optional source commit SHA for a manual controlled republish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: documentation-wiki-publication
  cancel-in-progress: false

jobs:
  scope:
    name: Check for publishable documentation changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Select publication scope
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! changed_files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}" --jq '.files[]?.filename')"; then
            echo "The trusted commit could not be inspected; publishing fail-safe."
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          publish=false
          while IFS= read -r file; do
            case "${file}" in
              docs/*|scripts/publish-docs-wiki.*|scripts/wiki-git-askpass.sh|.github/workflows/publish-docs-wiki.yml)
                publish=true
                break
                ;;
            esac
          done <<< "${changed_files}"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Validate and publish documentation wiki
    needs: scope
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.scope.outputs.publish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WIKI_PUBLISH_TOKEN: ${{ secrets.WIKI_PUBLISH_TOKEN }}
      WIKI_BRANCH: master
      WIKI_REPOSITORY: cryptnetworks/baseballstattrack.wiki.git
    steps:
      - name: Select trusted source and mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            echo "MODE=publish" >> "${GITHUB_ENV}"
            echo "SOURCE_SHA=${{ github.event.workflow_run.head_sha }}" >> "${GITHUB_ENV}"
          else
            echo "MODE=${{ inputs.mode }}" >> "${GITHUB_ENV}"
            echo "SOURCE_SHA=${{ inputs.source_sha || github.sha }}" >> "${GITHUB_ENV}"
          fi

      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Validate manifest, generated navigation, and workflow boundary
        run: npm run docs:wiki:validate && npm run docs:wiki:workflow:validate

      - name: Clone wiki publication target
        shell: bash
        env:
          WIKI_DIR: ${{ runner.temp }}/baseballstattrack-wiki
        run: |
          set -euo pipefail
          test -n "${WIKI_PUBLISH_TOKEN}" || { echo "WIKI_PUBLISH_TOKEN is required; refusing to access the wiki." >&2; exit 1; }
          export GIT_ASKPASS="${GITHUB_WORKSPACE}/scripts/wiki-git-askpass.sh"
          export GIT_TERMINAL_PROMPT=0
          chmod 700 "${GIT_ASKPASS}"
          echo "GIT_ASKPASS=${GIT_ASKPASS}" >> "${GITHUB_ENV}"
          echo "GIT_TERMINAL_PROMPT=${GIT_TERMINAL_PROMPT}" >> "${GITHUB_ENV}"
          git clone --depth 1 --branch "${WIKI_BRANCH}" "https://github.com/${WIKI_REPOSITORY}" "${WIKI_DIR}"
          git -C "${WIKI_DIR}" config user.name "baseballstattrack-docs-publisher"
          git -C "${WIKI_DIR}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Dry run or publish
        shell: bash
        env:
          WIKI_DIR: ${{ runner.temp }}/baseballstattrack-wiki
        run: |
          set -euo pipefail
          if [[ "${MODE}" == "dry-run" ]]; then
            npm run docs:wiki:dry-run -- --wiki-dir "${WIKI_DIR}" --source-sha "${SOURCE_SHA}" --target-branch "${WIKI_BRANCH}"
          elif [[ "${MODE}" == "publish" ]]; then
            npm run docs:wiki:publish -- --wiki-dir "${WIKI_DIR}" --source-sha "${SOURCE_SHA}" --target-branch "${WIKI_BRANCH}"
          else
            echo "Unsupported publication mode: ${MODE}" >&2
            exit 1
          fi
