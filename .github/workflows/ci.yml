name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  scope:
    name: Plan required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      application: ${{ steps.plan.outputs.application }}
      api: ${{ steps.plan.outputs.api }}
      containers: ${{ steps.plan.outputs.containers }}
      database: ${{ steps.plan.outputs.database }}
      discord: ${{ steps.plan.outputs.discord }}
      documentation: ${{ steps.plan.outputs.documentation }}
      operations: ${{ steps.plan.outputs.operations }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Classify changed paths
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail

          case "${EVENT_NAME}" in
            pull_request) base_sha="${PULL_REQUEST_BASE}" ;;
            push) base_sha="${PUSH_BASE}" ;;
            merge_group) base_sha="${MERGE_GROUP_BASE}" ;;
            *) base_sha="" ;;
          esac

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]] ||
             ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "A reliable base commit is unavailable; enabling every gate."
            node scripts/plan-ci.mjs --full >> "${GITHUB_OUTPUT}"
          else
            git diff --name-only -z "${base_sha}" "${GITHUB_SHA}" |
              node scripts/plan-ci.mjs >> "${GITHUB_OUTPUT}"
          fi

      - name: Record plan
        env:
          APPLICATION: ${{ steps.plan.outputs.application }}
          API: ${{ steps.plan.outputs.api }}
          CONTAINERS: ${{ steps.plan.outputs.containers }}
          DATABASE: ${{ steps.plan.outputs.database }}
          DISCORD: ${{ steps.plan.outputs.discord }}
          DOCUMENTATION: ${{ steps.plan.outputs.documentation }}
          OPERATIONS: ${{ steps.plan.outputs.operations }}
        run: |
          {
            echo "### CI execution plan"
            echo "| Scope | Required |"
            echo "| --- | --- |"
            echo "| Application | ${APPLICATION} |"
            echo "| API compatibility | ${API} |"
            echo "| Containers | ${CONTAINERS} |"
            echo "| Database | ${DATABASE} |"
            echo "| Discord service | ${DISCORD} |"
            echo "| Documentation | ${DOCUMENTATION} |"
            echo "| Operational drills | ${OPERATIONS} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  documentation:
    name: Documentation and repository policy
    needs: scope
    if: needs.scope.outputs.documentation == 'true' && needs.scope.outputs.application != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install verification dependencies
        run: npm ci --ignore-scripts

      - name: Verify formatting and repository policy
        run: npm run format && npm run policy:validate && npm run security:workflows:validate && npm run docs:wiki:validate && npm run docs:wiki:workflow:validate

  application:
    name: Application and database
    needs: scope
    if: needs.scope.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: baseballstattrack_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseballstattrack_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/baseballstattrack_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migration chain
        run: npm run db:migrate:deploy && npm run db:migrate:status && npm run db:migrate:verify && npm run db:representability

      - name: Reject breaking statistics API changes
        if: needs.scope.outputs.api == 'true' && github.event_name == 'pull_request'
        run: npm run api:contract -- --baseline-ref "origin/${GITHUB_BASE_REF}"

      - name: Run canonical quality verification
        run: npm run verify

      - name: Prove backup and restore
        if: needs.scope.outputs.operations == 'true'
        run: npm run db:restore:verify

      - name: Run stale-projection reliability drill
        if: needs.scope.outputs.operations == 'true'
        run: npm run reliability:drill

  discord:
    name: Discord service
    needs: scope
    if: needs.scope.outputs.discord == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/discord-bot/requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-deps --require-hashes --requirement services/discord-bot/requirements-dev.lock

      - name: Verify Discord bot
        working-directory: services/discord-bot
        run: python -m ruff check . && python -m ruff format --check . && python -m pytest

      - name: Build Discord bot container
        run: docker build --tag baseballstattrack-discord:ci services/discord-bot

  containers:
    name: Production containers
    needs: scope
    if: needs.scope.outputs.containers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and smoke-test containers
        run: bash scripts/container-smoke.sh

  verify:
    name: verify
    needs:
      - scope
      - documentation
      - application
      - discord
      - containers
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce planned results
        env:
          APPLICATION_PLANNED: ${{ needs.scope.outputs.application }}
          APPLICATION_RESULT: ${{ needs.application.result }}
          CONTAINERS_PLANNED: ${{ needs.scope.outputs.containers }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          DISCORD_PLANNED: ${{ needs.scope.outputs.discord }}
          DISCORD_RESULT: ${{ needs.discord.result }}
          DOCUMENTATION_PLANNED: ${{ needs.scope.outputs.documentation }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: |
          set -Eeuo pipefail

          [[ "${SCOPE_RESULT}" == "success" ]] || {
            echo "CI scope planning did not succeed." >&2
            exit 1
          }

          require_result() {
            local name=$1
            local planned=$2
            local result=$3

            if [[ "${planned}" == "true" ]]; then
              [[ "${result}" == "success" ]] || {
                echo "${name} was required but finished with ${result}." >&2
                return 1
              }
            else
              [[ "${result}" == "skipped" ]] || {
                echo "${name} was not required but finished with ${result}." >&2
                return 1
              }
            fi
          }

          documentation_job=false
          if [[ "${DOCUMENTATION_PLANNED}" == "true" && "${APPLICATION_PLANNED}" != "true" ]]; then
            documentation_job=true
          fi

          require_result "Application validation" "${APPLICATION_PLANNED}" "${APPLICATION_RESULT}"
          require_result "Container validation" "${CONTAINERS_PLANNED}" "${CONTAINERS_RESULT}"
          require_result "Discord validation" "${DISCORD_PLANNED}" "${DISCORD_RESULT}"
          require_result "Documentation validation" "${documentation_job}" "${DOCUMENTATION_RESULT}"

          if [[ "${APPLICATION_PLANNED}" != "true" &&
                "${CONTAINERS_PLANNED}" != "true" &&
                "${DISCORD_PLANNED}" != "true" &&
                "${documentation_job}" != "true" ]]; then
            echo "The CI plan selected no validation job." >&2
            exit 1
          fi

          echo "Every planned CI job passed."
