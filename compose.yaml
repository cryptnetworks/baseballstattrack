name: baseballstattrack

x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-baseballstattrack}
  POSTGRES_USER: ${POSTGRES_USER:-baseballstattrack}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}

x-application-environment: &application-environment
  NEXT_PUBLIC_APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: postgresql://${POSTGRES_USER:-baseballstattrack}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-baseballstattrack}?schema=public
  REQUIRED_DATABASE_MIGRATION: 20260731173000_product_analytics_consent
  WEBHOOK_SIGNING_MASTER_KEY: ${WEBHOOK_SIGNING_MASTER_KEY:-}
  WEBHOOK_WORKER_TOKEN: ${WEBHOOK_WORKER_TOKEN:-}

services:
  db:
    image: postgres:17-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
    environment: *database-environment
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    profiles:
      - tools
    image: ${MIGRATION_IMAGE:-baseballstattrack-migration:local}
    build:
      context: .
      target: migration
      args:
        VCS_REF: ${VCS_REF:-local}
    environment:
      <<: *application-environment
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  app:
    image: ${APP_IMAGE:-baseballstattrack:local}
    build:
      context: .
      target: runtime
      args:
        VCS_REF: ${VCS_REF:-local}
    environment:
      <<: *application-environment
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    networks:
      - backend
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s

  app-dev:
    profiles:
      - development
    image: ${DEV_IMAGE:-baseballstattrack-development:local}
    build:
      context: .
      target: development
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    environment:
      <<: *application-environment
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_PORT:-3001}:3000"
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    networks:
      - backend
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: "no"
    stop_grace_period: 15s

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  app-node-modules:
